# dsh-balanced-search bundle layer.
# Installed via `dsh plugin --profile web add github:tianmingwan/dsh-balanced-search`.
#
# This file is a *bundle* layer (declared by package.json's `dsh.bundle.patch`),
# so it is composed on top of the bundles listed before it in the profile —
# notably `@deepseek-ai/dsh-base`, which mounts the `web` row. That ordering is
# what lets the override below take effect without any manual profile edit.
- insert:
    - id: balanced-search
      name: dsh-balanced-search

# Take over dsh's built-in `web_search` / `web_fetch`.
#
# `index.js` registers a `ctx.web` provider with id `balanced` (it serves both
# the search and the fetch capability), so pinning the two provider ids here
# routes the built-in tools through the Keenable / Exa / Tavily / Firecrawl /
# AnySearch / TinyFish round-robin pool instead of the shipped
# `deepseek-official` search and `http` fetch backends.
#
# The bundle has a second, independent surface: `index.js` also registers the
# plugin-owned `balanced_search` / `balanced_fetch` tools (they carry
# `time_range`, an explicit result count and `max_chars`/`live`, which the seam
# request does not). The two surfaces share one provider pool. The takeover
# below is what gives the built-in tools the official search card, globe icon
# and step wording in the GUI.
#
# Two mechanics worth knowing:
#
#   * A patch replaces the targeted row's whole `config` rather than merging
#     into it, so BOTH fields must be restated — omitting one would clear it.
#   * A user's own cordis.patch.yml is applied after every bundle layer, so
#     these two lines remain overridable (and removable) per profile.
#
# Requires at least one of KEENABLE_API_KEY / EXA_API_KEY / TAVILY_API_KEY /
# FIRECRAWL_API_KEY / ANYSEARCH_API_KEY / TINYFISH_API_KEY. With none set the
# provider reports itself unavailable, and
# the built-in tools fail with
# `WEB_PROVIDER_CONFIGURED_UNAVAILABLE` naming `balanced` — there is no fallback
# to the shipped providers. Remove these two lines to fall back.
#
# The GUI's web-search settings page also writes this row, switching it to
# `deepseek-search-api` / `deepseek-fetch-api`. Those ids are not registered in
# this composition, so saving that page would break web search outright.
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: balanced
    fetchProvider: balanced
